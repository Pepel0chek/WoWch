<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Тест микрофона</title>
<style>
body { background: #313338; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
button { padding: 20px 40px; font-size: 20px; background: #5865f2; color: white; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 20px; }
#result { font-size: 24px; font-weight: bold; text-align: center; max-width: 80%; }
</style>
</head>
<body>
  <h1>Проверка микрофона</h1>
  <button onclick="testMic()">Нажми для теста</button>
  <div id="result"></div>

  <script>
    async function testMic() {
      const res = document.getElementById('result');
      res.style.color = '#faa61a'; // Оранжевый (загрузка)
      res.innerText = "Запрос доступа...";
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        res.style.color = '#23a559'; // Зеленый (успех)
        res.innerText = "✅ УСПЕХ! Микрофон работает.";
        // Выключаем поток, чтобы не занимать
        stream.getTracks().forEach(t => t.stop());
      } catch (e) {
        res.style.color = '#da373c'; // Красный (ошибка)
        res.innerText = "❌ ОШИБКА: " + e.name + "\n" + e.message;
      }
    }
  </script>
</body>
</html>
