<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WoWCh</title>
<meta name="theme-color" content="#5865f2">
<style>
:root {
  --bg: #313338; --side: #2b2d31; --rail: #1e1f22; --tx: #dbdee1; --mu: #949ba4;
  --in: #383a40; --hov: #3a3c43; --br: #5865f2; --ok: #23a559; --err: #da373c;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
body { background: var(--bg); color: var(--tx); height: 100vh; display: flex; overflow: hidden; font-size: 16px; }

/* Основные панели */
#rail { width: 80px; background: var(--rail); display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 12px; z-index: 10; overflow-y: auto; }
.sv { width: 56px; height: 56px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-weight: 700; cursor: pointer; transition: .2s; font-size: 24px; position: relative; flex-shrink: 0; color: var(--tx); }
.sv:hover, .sv.on { border-radius: 18px; background: var(--br); color: #fff; }
.sv.hm { background: var(--br); color: #fff; }
.sv.add { color: var(--ok); font-size: 28px; background: transparent; border: 2px dashed var(--mu); }
.sv.add:hover { border-color: var(--ok); border-radius: 50%; background: var(--hov); }
.divider { width: 40px; height: 2px; background: var(--side); border-radius: 1px; margin: 4px 0; flex-shrink: 0; }

#side { width: 280px; background: var(--side); display: flex; flex-direction: column; z-index: 5; }
.hd { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-weight: 700; border-bottom: 1px solid var(--rail); font-size: 16px; }
#chs { flex: 1; overflow-y: auto; padding: 12px; }
.ch { display: flex; align-items: center; padding: 10px 12px; border-radius: 6px; cursor: pointer; color: var(--mu); font-weight: 500; margin-bottom: 4px; transition: .1s; gap: 12px; font-size: 15px; }
.ch:hover, .ch.on { background: var(--hov); color: var(--tx); }
.ch.voice { color: var(--tx); }
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; flex-shrink: 0; font-size: 16px; position: relative; background-size: cover; background-position: center; cursor: pointer; }
.dot { width: 12px; height: 12px; border-radius: 50%; position: absolute; bottom: -2px; right: -2px; border: 2px solid var(--side); }
.online { background: var(--ok); } .offline { background: var(--mu); }

.voice-users { padding-left: 36px; margin-top: 6px; margin-bottom: 8px; }
.v-user { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 14px; color: var(--mu); position: relative; }
.v-user.speaking .av { box-shadow: 0 0 0 3px var(--ok); }
.v-user .av { width: 28px; height: 28px; font-size: 12px; }

#me { padding: 12px 16px; background: var(--rail); display: flex; align-items: center; justify-content: space-between; }
#me-info { display: flex; align-items: center; overflow: hidden; cursor: pointer; padding: 6px; border-radius: 8px; transition: .2s; flex: 1; }
#me-info:hover { background: var(--hov); }
#me-info span { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: 10px; }

/* Главная зона */
#main { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; min-width: 0; }
#chat-header { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--rail); z-index: 2; }
#chat-name { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 10px; }

#msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
.welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--mu); text-align: center; }

.msg { display: flex; padding: 6px 0; margin-top: 16px; }
.msg.cont { margin-top: 0; padding-top: 2px; }
.msg .av { width: 44px; height: 44px; margin-right: 16px; font-size: 18px; }
.msg.cont .av { visibility: hidden; height: 0; margin-top: 0; }
.msg-content { flex: 1; min-width: 0; }
.msg-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.msg-head .nm { font-weight: 600; font-size: 16px; cursor: pointer; }
.msg-head .nm:hover { text-decoration: underline; }
.msg-head .time { font-size: 13px; color: var(--mu); }
.msg-text { color: var(--tx); line-height: 1.5; word-break: break-word; white-space: pre-wrap; font-size: 16px; }
.msg-text a { color: #00a8fc; text-decoration: none; }
.msg-img { max-width: min(450px, 100%); max-height: 400px; border-radius: 10px; margin-top: 8px; cursor: pointer; display: block; }
.msg-file { display: flex; align-items: center; gap: 12px; background: var(--side); padding: 12px 16px; border-radius: 10px; margin-top: 8px; color: var(--tx); text-decoration: none; font-weight: 600; font-size: 15px; border: 1px solid var(--rail); max-width: 350px; }

#bar { padding: 0 20px 20px; display: flex; align-items: center; background: var(--bg); position: relative; }
.cmp-box { display: flex; align-items: center; background: var(--in); border-radius: 10px; padding: 0 16px; flex: 1; min-height: 52px; }
.icon-btn { background: transparent; color: var(--mu); border: 0; border-radius: 8px; padding: 10px; cursor: pointer; font-size: 24px; transition: .2s; display: flex; align-items: center; justify-content: center; }
#in { flex: 1; background: transparent; border: 0; padding: 14px 12px; color: var(--tx); outline: 0; font-size: 16px; }
#btn-send { background: transparent; color: var(--mu); border: 0; cursor: pointer; font-size: 24px; padding: 10px; display: grid; place-items: center; }

/* Кнопки и модалки */
button.action { border: 0; border-radius: 6px; padding: 10px 18px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: .2s; font-size: 15px; }
button.br { background: var(--br); color: #fff; } button.br:hover { filter: brightness(1.1); }
button.sec { background: var(--in); color: var(--tx); } button.sec:hover { background: var(--hov); }

#modal-bg, #settings-bg, #server-bg, #edit-server-bg, #invite-bg, #profile-view-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 300; backdrop-filter: blur(4px); }
.modal { background: var(--bg); padding: 32px; border-radius: 12px; width: 440px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto; }
.modal h3 { margin-bottom: 20px; font-size: 24px; text-align: center; }
.modal input[type=text], .modal input[type=password], .modal select, .modal textarea { width: 100%; padding: 14px; border-radius: 6px; border: 0; background: var(--in); color: #fff; font-size: 16px; margin-bottom: 20px; outline: 0; resize: none; }
.modal label { font-size: 14px; color: var(--mu); margin-bottom: 6px; display: block; }
.modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }

#login { position: fixed; inset: 0; background: var(--rail); display: flex; align-items: center; justify-content: center; z-index: 200; }
.login-box { background: var(--bg); padding: 40px; border-radius: 12px; width: 440px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
.login-box h1 { margin-bottom: 10px; font-size: 28px; }
.login-box p { color: var(--mu); margin-bottom: 24px; font-size: 16px; }
.login-box input { width: 100%; padding: 16px; border-radius: 6px; border: 0; background: var(--in); color: #fff; font-size: 18px; margin-bottom: 20px; outline: 0; }
.login-box button { width: 100%; padding: 16px; background: var(--br); border: 0; border-radius: 6px; color: #fff; font-weight: 700; font-size: 18px; cursor: pointer; }

/* Звонки */
#call-ui { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); color: #fff; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
#call-ui.on { display: flex; }
#call-avatar-box { width: 160px; height: 160px; border-radius: 50%; margin-bottom: 30px; position: relative; box-shadow: 0 0 40px rgba(88,101,242,0.6); background: var(--br); display: grid; place-items: center; font-size: 64px; font-weight: 700; background-size: cover; background-position: center; border: 5px solid rgba(255,255,255,0.2); }
#call-name { font-size: 32px; font-weight: 700; margin-bottom: 10px; text-shadow: 0 2px 6px rgba(0,0,0,0.5); }
#call-btns { display: flex; gap: 30px; margin-top: 60px; }
#call-btns button { width: 76px; height: 76px; border-radius: 50%; font-size: 30px; padding: 0; border: 0; cursor: pointer; color: #fff; display: grid; place-items: center; transition: .2s; backdrop-filter: blur(4px); }
#btn-dec { background: var(--err); } #btn-acc { background: var(--ok); }
#btn-mute { background: rgba(255,255,255,0.2); }
.hidden { display: none !important; }

/* Карточка профиля */
#profile-view-bg .modal { padding: 0; overflow: hidden; width: 360px; }
.pv-banner { height: 100px; background: var(--br); }
.pv-avatar { width: 100px; height: 100px; border-radius: 50%; border: 6px solid var(--bg); background-size: cover; background-position: center; margin: -50px auto 10px; display: grid; place-items: center; font-size: 40px; font-weight: 700; color: #fff; }
.pv-content { padding: 0 24px 24px; text-align: center; }
.pv-name { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.pv-status { color: var(--mu); font-size: 14px; margin-bottom: 16px; }
.pv-bio { background: var(--in); padding: 12px; border-radius: 8px; font-size: 14px; text-align: left; margin-bottom: 20px; }
.pv-bio h4 { margin-bottom: 6px; color: var(--tx); font-size: 12px; text-transform: uppercase; }

#toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--tx); color: var(--bg); padding: 12px 24px; border-radius: 6px; font-weight: 600; font-size: 15px; opacity: 0; transition: opacity 0.3s; z-index: 999; pointer-events: none; text-align: center; }
#toast.show { opacity: 1; }
::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: var(--rail); border-radius: 5px; }
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, getDoc, updateDoc, arrayUnion, limit, deleteField } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD5vrDqL4tGPzpQDLpy4j2vJepPrVAVFzc",
  authDomain: "wowch-949f8.firebaseapp.com",
  projectId: "wowch-949f8",
  storageBucket: "wowch-949f8.firebasestorage.app",
  messagingSenderId: "1073245247353",
  appId: "1:1073245247353:web:3f79e21d46e67de4c8d828"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let myId = null, myPeerId = null, myAvatar = null, myDisplayName = null, myColor = null;
let friends = [], servers = [];
let activeChat = null, activeServerData = null, activeServerSid = null;
let unsubMsgs = null, unsubOnline = null, unsubVoice = null, peer = null;
let onlineUsers = {}, usersCache = {};
let currentFriendName = '';
let currentVoiceChannel = null;
let activeCalls = {}; 
let activePersonalCall = null;
let hasMicPermission = false;

const $ = s => document.querySelector(s);

function toast(msg, ms=4000) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

function getColor(str) {
  let hash = 0; for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
  const c = (hash & 0x00FFFFFF).toString(16).toUpperCase();
  return '#' + '00000'.substring(0, 6 - c.length) + c;
}

function createAvatar(name, avatarUrl, statusDot = false, isOnline = false) {
  const av = document.createElement('div'); av.className = 'av';
  if (avatarUrl) { av.style.backgroundImage = `url(${avatarUrl})`; } 
  else { av.textContent = (name||'U')[0].toUpperCase(); av.style.background = getColor(name||'U'); }
  if (statusDot) { const dot = document.createElement('div'); dot.className = 'dot ' + (isOnline ? 'online' : 'offline'); av.append(dot); }
  return av;
}

// --- МУЗЫКА ДЛЯ ЗВОНКОВ ---
let ringtoneInterval = null;
let audioCtx = null;

function playRingtone(type) {
  stopRingtone();
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const playBeep = (freq, duration, timeOffset) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, audioCtx.currentTime + timeOffset);
    gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + timeOffset + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + timeOffset + duration);
    osc.start(audioCtx.currentTime + timeOffset);
    osc.stop(audioCtx.currentTime + timeOffset + duration);
  };

  const playPattern = () => {
    if (type === 'outgoing') playBeep(425, 1.0, 0);
    else {
      playBeep(880, 0.15, 0);
      playBeep(1046, 0.15, 0.15);
      playBeep(880, 0.15, 0.3);
      playBeep(1046, 0.15, 0.45);
    }
  };
  playPattern();
  ringtoneInterval = setInterval(playPattern, type === 'outgoing' ? 4000 : 2000);
}
function stopRingtone() {
  if (ringtoneInterval) { clearInterval(ringtoneInterval); ringtoneInterval = null; }
}

// --- ТЕСТ МИКРОФОНА ---
$('#btn-test-mic').onclick = async () => {
  const res = $('#mic-test-result');
  res.style.color = '#faa61a'; res.innerText = "Запрос...";
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    res.style.color = '#23a559'; res.innerText = "✅ Микрофон работает!";
    hasMicPermission = true;
    stream.getTracks().forEach(t => t.stop());
  } catch (e) {
    res.style.color = '#da373c'; res.innerText = "❌ Ошибка: " + e.name;
    alert("Причина: " + e.name);
  }
};

// --- ВХОД ---
window.login = async () => {
  const name = $('#username').value.trim();
  const pass = $('#password').value;
  if (name.length < 3) return $('#login-msg').textContent = 'Логин от 3 символов';
  const id = name.toLowerCase().replace(/[^a-z0-9_]/g, '');
  $('#login-msg').textContent = 'Загрузка...';
  
  const userRef = doc(db, 'users', id);
  const snap = await getDoc(userRef);

  if (!snap.exists()) {
    myPeerId = 'peer-' + Math.random().toString(36).slice(2, 10);
    myColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
    await setDoc(userRef, { id: id, displayName: name, avatar: '', color: myColor, bio: '', password: pass, peerId: myPeerId, friends: [], servers: [] });
    friends = []; servers = [];
  } else {
    const data = snap.data();
    if (data.password && data.password !== pass) return $('#login-msg').textContent = 'Неверный пароль!';
    myPeerId = data.peerId || ('peer-' + Math.random().toString(36).slice(2, 10));
    friends = [...new Set(data.friends || [])]; 
    servers = [...new Set(data.servers || [])];
    myAvatar = data.avatar; myDisplayName = data.displayName; myColor = data.color || getColor(name);
    await updateDoc(userRef, { peerId: myPeerId });
  }

  myId = id; myDisplayName = name;
  localStorage.setItem('wowch_uid', myId);
  localStorage.setItem('wowch_name', name);
  
  $('#login').style.display = 'none'; $('#rail').style.display = 'flex'; $('#side').style.display = 'flex'; $('#main').style.display = 'flex';
  $('#mic-test-panel').style.display = 'flex';
  
  updateMyUI();

  await setDoc(onlineRef, { t: Date.now() });
  setInterval(() => setDoc(onlineRef, { t: Date.now() }), 15000);

  initPeer();
  switchToFriends();
  listenOnline();
  renderServers();
};

async function joinVoice(sid, cid) {
  if (!hasMicPermission) return alert('Сначала нажмите "🎤 Тест Микрофона" в правом нижнем углу!');
  if (currentVoiceChannel === `${sid}_${cid}`) { leaveVoice(); return; }
  if (currentVoiceChannel) leaveVoice();
  
  currentVoiceChannel = `${sid}_${cid}`;
  toast('Вы в голосовом канале ' + cid);

  await updateDoc(doc(db, 'servers', sid), {
    [`voice_${cid}.${myId}`]: { name: myDisplayName, avatar: myAvatar || '', peerId: myPeerId }
  });
}

async function leaveVoice() {
  if (!currentVoiceChannel) return;
  const [sid, cid] = currentVoiceChannel.split('_');
  await updateDoc(doc(db, 'servers', sid), { [`voice_${cid}.${myId}`]: deleteField() });
  
  Object.values(activeCalls).forEach(call => call.close());
  activeCalls = {};
  currentVoiceChannel = null;
}

function listenVoice(sid) {
  if (unsubVoice) unsubVoice();
  unsubVoice = onSnapshot(doc(db, 'servers', sid), snap => {
    if (!snap.exists()) return;
    const data = snap.data();
    
    activeServerData.channels.forEach(c => {
      const vBox = $('#v-box-' + c.id);
      if (!vBox) return;
      vBox.innerHTML = '';
      const voiceUsers = data[`voice_${c.id}`] || {};
      
      Object.entries(voiceUsers).forEach(([uid, u]) => {
        const uEl = document.createElement('div'); uEl.className = 'v-user';
        uEl.append(createAvatar(u.name, u.avatar));
        uEl.append(document.createTextNode(u.name + (uid === myId ? ' (Вы)' : '')));
        vBox.append(uEl);
        
        if (currentVoiceChannel === `${sid}_${c.id}` && uid !== myId && u.peerId) {
          if (!activeCalls[uid]) {
            if (myId < uid) {
              navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                const call = peer.call(u.peerId, stream, { metadata: { name: myDisplayName, avatar: myAvatar } });
                setupVoiceCall(call, uid);
              }).catch(e => console.log('Mic err:', e));
            }
          }
        }
      });
    });
  });
}

function setupVoiceCall(call, uid) {
  activeCalls[uid] = call;
  call.on('stream', remote => { 
    const audio = new Audio(); 
    audio.srcObject = remote; 
    audio.play().catch(e => console.log('Audio play blocked:', e)); 
  });
  call.on('close', () => { delete activeCalls[uid]; });
  call.on('error', () => { delete activeCalls[uid]; });
}

function loadMessages() {
  if (!activeChat) return;
  const msgsBox = $('#msgs'); msgsBox.innerHTML = ''; if (unsubMsgs) unsubMsgs();
  const chatId = activeChat.type === 'friend' ? [myId, activeChat.id].sort().join('_') : activeChat.id;
  const q = query(collection(db, 'chats', chatId, 'messages'), orderBy('t', 'asc'), limit(100));
  let lastUid = null; let lastTime = 0;
  unsubMsgs = onSnapshot(q, snap => {
    msgsBox.innerHTML = ''; lastUid = null; lastTime = 0;
    snap.forEach(doc => {
      const m = doc.data(); const isMe = m.uid === myId;
      const isCont = m.uid === lastUid && (m.t - lastTime) < 300000; lastUid = m.uid; lastTime = m.t;
      const msg = document.createElement('div'); msg.className = 'msg' + (isCont ? ' cont' : '');
      
      const av = createAvatar(isMe ? myDisplayName : (m.name || 'U'), isMe ? myAvatar : m.avatar);
      if (!isMe) av.onclick = () => viewProfile(m.uid);
      else av.onclick = () => viewProfile(myId);
      msg.append(av);
      
      const content = document.createElement('div'); content.className = 'msg-content';
      if (!isCont) {
        const head = document.createElement('div'); head.className = 'msg-head';
        const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = isMe ? myDisplayName : (m.name || activeChat.name); nm.style.color = isMe ? myColor : (m.color || getColor(m.name || 'U'));
        nm.onclick = () => viewProfile(isMe ? myId : m.uid);
        const time = document.createElement('span'); time.className = 'time'; time.textContent = new Date(m.t).toLocaleTimeString('ru', {hour:'2-digit',minute:'2-digit'});
        head.append(nm, time); content.append(head);
      }
      if (m.text) { const txt = document.createElement('div'); txt.className = 'msg-text'; txt.innerHTML = m.text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>'); content.append(txt); }
      if (m.file) {
        if (m.fileType?.startsWith('image/')) { const img = document.createElement('img'); img.src = m.file; img.className = 'msg-img'; img.onclick = () => window.open(m.file, '_blank'); content.append(img); }
        else { const file = document.createElement('a'); file.href = m.file; file.download = m.fileName; file.className = 'msg-file'; file.innerHTML = `📄 ${m.fileName}`; content.append(file); }
      }
      msg.append(content); msgsBox.append(msg);
    });
    msgsBox.scrollTop = msgsBox.scrollHeight;
  });
}

// --- ЛИЧНЫЕ ЗВОНКИ ---
function initPeer() {
  if (peer) peer.destroy();
  
  fetch('https://wowch-calls.onrender.com').catch(() => {});
  peer = new Peer(myPeerId, {
    host: 'wowch-calls.onrender.com', port: 443, path: '/', secure: true,
    config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
  });
  
  peer.on('error', err => console.log('Ошибка PeerJS:', err.type));
  
  peer.on('call', call => {
    if (currentVoiceChannel && call.metadata && call.metadata.name) {
      navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        call.answer(stream);
        setupVoiceCall(call, call.peer);
      }).catch(e => console.log('Mic err:', e));
      return;
    }

    if (activePersonalCall) { call.close(); return; }
    
    let callerName = call.metadata?.name || 'Неизвестный'; let callerAvatar = call.metadata?.avatar || null;
    $('#call-name').textContent = callerName + ' звонит...'; $('#call-status').textContent = 'Входящий звонок';
    const av = $('#call-avatar-box');
    if (callerAvatar) { av.style.backgroundImage = `url(${callerAvatar})`; av.textContent = ''; }
    else { av.style.backgroundImage = 'none'; av.style.background = getColor(callerName); av.textContent = callerName[0].toUpperCase(); }
    $('#call-ui').classList.add('on'); $('#btn-acc').classList.remove('hidden'); $('#btn-dec').classList.remove('hidden');
    
    playRingtone('incoming');
    
    $('#btn-acc').onclick = () => {
      stopRingtone();
      navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        activePersonalCall = call;
        call.answer(stream); 
        $('#btn-acc').classList.add('hidden'); 
        $('#call-name').textContent = callerName; 
        $('#call-status').textContent = 'Разговор'; 
        setupPersonalCallUI(call);
      }).catch(() => { alert('Нет доступа к микрофону'); call.close(); endCall(); });
    };
    
    $('#btn-dec').onclick = () => { call.close(); endCall(); };
  });
}

window.startCall = async () => {
  if (!activeChat || activeChat.type !== 'friend') return;
  let fData = usersCache[activeChat.id];
  if (!fData) { const snap = await getDoc(doc(db, 'users', activeChat.id)); fData = snap.data(); }
  if (!fData || !fData.peerId) return alert('Друг не в сети.');
  
  if (!hasMicPermission) return alert('Сначала нажмите "🎤 Тест Микрофона"!');
  
  toast('Звоним...');
  
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    $('#call-name').textContent = currentFriendName; 
    $('#call-status').textContent = 'Звоним...';
    const av = $('#call-avatar-box');
    if (fData.avatar) { av.style.backgroundImage = `url(${fData.avatar})`; av.textContent = ''; }
    else { av.style.backgroundImage = 'none'; av.style.background = getColor(currentFriendName); av.textContent = currentFriendName[0].toUpperCase(); }
    $('#call-ui').classList.add('on'); $('#btn-acc').classList.add('hidden'); $('#btn-dec').classList.remove('hidden');
    
    playRingtone('outgoing');

    activePersonalCall = peer.call(fData.peerId, stream, { metadata: { name: myDisplayName, avatar: myAvatar } });
    setupPersonalCallUI(activePersonalCall);
  } catch (e) {
    alert('Ошибка доступа к микрофону! Код: ' + e.name);
  }
};

function setupPersonalCallUI(call) {
  call.on('stream', remote => { 
    stopRingtone();
    $('#call-status').textContent = 'Соединено'; 
    const audio = new Audio(); 
    audio.srcObject = remote; 
    audio.play().catch(e => console.log('Audio play blocked', e)); 
  });
  call.on('close', () => { endCall(); });
}

function endCall() { 
  stopRingtone();
  $('#call-ui').classList.remove('on'); 
  if (activePersonalCall) { activePersonalCall.close(); activePersonalCall = null; }
}
$('#btn-dec').onclick = endCall;
</script>
</body>
</html>
