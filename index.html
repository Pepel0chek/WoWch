<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WoWCh</title>
<style>
:root{--bg:#313338;--side:#2b2d31;--rail:#1e1f22;--tx:#dbdee1;--mu:#949ba4;--in:#383a40;--hov:#3a3c43;--br:#5865f2;--ok:#23a559;--err:#da373c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 Arial,sans-serif;height:100vh;display:flex;overflow:hidden}
#side{width:260px;background:var(--side);display:flex;flex-direction:column;border-right:1px solid var(--rail)}
.hd{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:700;border-bottom:1px solid var(--rail)}
#main{flex:1;display:flex;flex-direction:column}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{padding:8px 12px;border-radius:8px;max-width:80%;word-break:break-word}
.msg.me{background:var(--br);color:#fff;align-self:flex-end}
.msg.them{background:var(--rail);align-self:flex-start}
.msg .nm{font-size:12px;font-weight:700;opacity:0.7;margin-bottom:4px}
#bar{padding:16px;background:var(--side);display:flex;gap:12px}
#in{flex:1;background:var(--in);border:0;border-radius:8px;padding:12px;color:var(--tx);outline:0;font-size:15px}
button{background:var(--br);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;display:grid;place-items:center}
button:hover{filter:brightness(1.1)}
button.sec{background:var(--in);color:var(--tx)}
#conn{font-size:12px;color:var(--mu);padding:8px 16px;background:var(--side);border-top:1px solid var(--rail)}

#call-ui{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;color:#fff}
#call-ui.on{display:flex}
#call-ui h2{margin-bottom:16px;font-size:24px}
#call-btns{display:flex;gap:16px;margin-top:32px}
#call-btns button{width:64px;height:64px;border-radius:50%;font-size:24px;padding:0}
#btn-dec{background:var(--err)}
#btn-acc{background:var(--ok)}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="side">
  <div class="hd">
    <span>WoWCh</span>
    <button id="btn-id" style="padding:4px 8px;font-size:12px">🆔 Мой ID</button>
  </div>
  <div style="padding:16px;color:var(--mu);font-size:14px" id="my-info">Загрузка...</div>
</div>

<div id="main">
  <div class="hd">
    <span id="chat-name">Чат</span>
    <button id="btn-call" class="sec">📞 Звонок</button>
  </div>
  <div id="msgs">
    <div style="color:var(--mu);text-align:center;margin-top:20px">Нажмите «🆔 Мой ID», чтобы начать.</div>
  </div>
  <div id="bar">
    <input id="in" placeholder="Написать сообщение..." autocomplete="off">
    <button id="btn-send">➤</button>
  </div>
  <div id="conn">Подключение к базе...</div>
</div>

<div id="call-ui">
  <h2 id="call-title">Звонок...</h2>
  <div style="color:#aaa" id="call-status">Соединение...</div>
  <div id="call-btns">
    <button id="btn-acc" class="hidden">✅</button>
    <button id="btn-mute">🎤</button>
    <button id="btn-dec">❌</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD5vrDqL4tGPzpQDLpy4j2vJepPrVAVFzc",
  authDomain: "wowch-949f8.firebaseapp.com",
  projectId: "wowch-949f8",
  storageBucket: "wowch-949f8.firebasestorage.app",
  messagingSenderId: "1073245247353",
  appId: "1:1073245247353:web:3f79e21d46e67de4c8d828"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let myId = localStorage.getItem('wowch_uid') || 'user-' + Math.random().toString(36).slice(2,6);
localStorage.setItem('wowch_uid', myId);
let friendId = localStorage.getItem('friend_id');
let unsubMsgs = null;

let pc = null;
let micStream = null;
let currentCallId = null;
let unsubCall = null;
let unsubCandidates = null;

const $ = s => document.querySelector(s);

// --- ЧАТ ---
document.getElementById('my-info').innerHTML = `<b>Ваш ID:</b> ${myId}`;
document.getElementById('conn').textContent = 'Готов к работе';
document.getElementById('conn').style.color = 'var(--ok)';

window.setFriend = () => {
  const t = prompt("Введите ID друга (например, user-abc12):");
  if (t && t !== myId) {
    friendId = t;
    localStorage.setItem('friend_id', friendId);
    loadChat();
  }
};
document.getElementById('btn-id').onclick = window.setFriend;

function loadChat() {
  if (!friendId) return;
  document.getElementById('chat-name').textContent = 'Чат с ' + friendId;
  if (unsubMsgs) unsubMsgs();
  
  const chatId = [myId, friendId].sort().join('_');
  const q = query(collection(db, 'chats', chatId, 'messages'), orderBy('t', 'asc'));
  
  unsubMsgs = onSnapshot(q, snap => {
    const msgs = document.getElementById('msgs');
    msgs.innerHTML = '';
    snap.forEach(doc => {
      const m = doc.data();
      const div = document.createElement('div');
      div.className = 'msg ' + (m.uid === myId ? 'me' : 'them');
      div.innerHTML = `<div class="nm">${m.name}</div>${m.text}`;
      msgs.append(div);
    });
    msgs.scrollTop = msgs.scrollHeight;
  });
}

window.sendMsg = async () => {
  const inp = document.getElementById('in');
  const txt = inp.value.trim();
  if (!txt || !friendId) return;
  inp.value = '';
  const chatId = [myId, friendId].sort().join('_');
  await addDoc(collection(db, 'chats', chatId, 'messages'), {
    uid: myId, name: myId, text: txt, t: Date.now()
  });
};

document.getElementById('btn-send').onclick = window.sendMsg;
document.getElementById('in').onkeydown = e => { if (e.key === 'Enter') window.sendMsg(); };

// --- ЗВОНКИ (WebRTC + Firebase) ---
const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };

window.startCall = async () => {
  if (!friendId) return alert('Сначала укажите ID друга (кнопка 🆔).');
  if (pc) return alert('Вы уже в звонке.');

  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    return alert('Нет доступа к микрофону! Разрешите его в настройках браузера.');
  }

  currentCallId = [myId, friendId].sort().join('_');
  const callDoc = doc(db, 'calls', currentCallId);
  const offerCandidates = collection(callDoc, 'callerCandidates');
  const answerCandidates = collection(callDoc, 'calleeCandidates');

  pc = new RTCPeerConnection(rtcConfig);
  micStream.getTracks().forEach(track => pc.addTrack(track, micStream));

  pc.ontrack = event => {
    const audio = new Audio();
    audio.srcObject = event.streams[0];
    audio.play();
  };

  pc.onicecandidate = event => {
    if (event.candidate) addDoc(offerCandidates, event.candidate.toJSON());
  };

  const offerDescription = await pc.createOffer();
  await pc.setLocalDescription(offerDescription);

  await setDoc(callDoc, { offer: { sdp: offerDescription.sdp, type: offerDescription.type }, status: 'ringing' });

  unsubCall = onSnapshot(callDoc, snapshot => {
    const data = snapshot.data();
    if (!pc.currentRemoteDescription && data?.answer) {
      pc.setRemoteDescription(new RTCSessionDescription(data.answer));
    }
    if (data?.status === 'ended') endCall();
  });

  unsubCandidates = onSnapshot(answerCandidates, snapshot => {
    snapshot.docChanges().forEach(change => {
      if (change.type === 'added') pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
    });
  });

  $('#call-title').textContent = 'Звоним...';
  $('#call-ui').classList.add('on');
};

async function answerCall(offer, callId) {
  currentCallId = callId;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    return alert('Нет доступа к микрофону!');
  }

  const callDoc = doc(db, 'calls', currentCallId);
  const offerCandidates = collection(callDoc, 'callerCandidates');
  const answerCandidates = collection(callDoc, 'calleeCandidates');

  pc = new RTCPeerConnection(rtcConfig);
  micStream.getTracks().forEach(track => pc.addTrack(track, micStream));

  pc.ontrack = event => {
    const audio = new Audio();
    audio.srcObject = event.streams[0];
    audio.play();
  };

  pc.onicecandidate = event => {
    if (event.candidate) addDoc(answerCandidates, event.candidate.toJSON());
  };

  await pc.setRemoteDescription(new RTCSessionDescription(offer));
  const answerDescription = await pc.createAnswer();
  await pc.setLocalDescription(answerDescription);

  await updateDoc(callDoc, { answer: { type: answerDescription.type, sdp: answerDescription.sdp }, status: 'connected' });

  unsubCandidates = onSnapshot(offerCandidates, snapshot => {
    snapshot.docChanges().forEach(change => {
      if (change.type === 'added') pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
    });
  });

  $('#call-title').textContent = 'Разговор';
  $('#call-status').textContent = 'Соединено';
  $('#call-ui').classList.add('on');
  $('#btn-acc').classList.add('hidden');
}

function endCall() {
  if (pc) { pc.close(); pc = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (currentCallId) {
    updateDoc(doc(db, 'calls', currentCallId), { status: 'ended' }).catch(() => {});
    currentCallId = null;
  }
  if (unsubCall) unsubCall();
  if (unsubCandidates) unsubCandidates();
  $('#call-ui').classList.remove('on');
  $('#btn-acc').classList.add('hidden');
}

document.getElementById('btn-call').onclick = () => {
  if (!friendId) return window.setFriend();
  window.startCall();
};
document.getElementById('btn-dec').onclick = endCall;
document.getElementById('btn-mute').onclick = () => {
  if (micStream) {
    const track = micStream.getAudioTracks()[0];
    track.enabled = !track.enabled;
    document.getElementById('btn-mute').textContent = track.enabled ? '🎤' : '🔇';
  }
};

// Слушаем входящие звонки
onSnapshot(collection(db, 'calls'), snapshot => {
  snapshot.docChanges().forEach(change => {
    if (change.type === 'added') {
      const data = change.doc.data();
      if (data.status === 'ringing' && change.doc.id.includes(myId) && change.doc.id.includes(friendId)) {
        $('#call-title').textContent = 'Входящий звонок';
        $('#call-ui').classList.add('on');
        $('#btn-acc').classList.remove('hidden');
        $('#btn-acc').onclick = () => answerCall(data.offer, change.doc.id);
      }
    }
  });
});

if (friendId) loadChat();
</script>
</body>
</html>
