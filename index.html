<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WoWCh</title>
<meta name="theme-color" content="#5865f2">
<style>
:root {
  --bg: #313338; --side: #2b2d31; --rail: #1e1f22; --tx: #dbdee1; --mu: #949ba4;
  --in: #383a40; --hov: #3a3c43; --br: #5865f2; --ok: #23a559; --err: #da373c;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
body { background: var(--bg); color: var(--tx); height: 100vh; display: flex; overflow: hidden; font-size: 15px; }

/* Левая панель серверов */
#rail { width: 72px; background: var(--rail); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 8px; z-index: 10; overflow-y: auto; }
.sv { width: 48px; height: 48px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-weight: 700; cursor: pointer; transition: .2s; font-size: 20px; position: relative; flex-shrink: 0; color: var(--tx); }
.sv:hover, .sv.on { border-radius: 16px; background: var(--br); color: #fff; }
.sv.hm { background: var(--br); color: #fff; font-size: 24px; }
.sv.add { color: var(--ok); font-size: 24px; background: transparent; border: 2px dashed var(--mu); }
.sv.add:hover { border-color: var(--ok); border-radius: 50%; background: var(--hov); }
.divider { width: 32px; height: 2px; background: var(--side); border-radius: 1px; margin: 4px 0; flex-shrink: 0; }

/* Список друзей и каналов */
#side { width: 240px; background: var(--side); display: flex; flex-direction: column; z-index: 5; }
.hd { height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-weight: 700; border-bottom: 1px solid var(--rail); font-size: 15px; }
#chs { flex: 1; overflow-y: auto; padding: 8px; }
.ch { display: flex; align-items: center; padding: 6px 8px; border-radius: 4px; cursor: pointer; color: var(--mu); font-weight: 500; margin-bottom: 2px; transition: .1s; }
.ch:hover { background: var(--hov); color: var(--tx); }
.ch.on { background: var(--hov); color: var(--tx); }
.ch .av { margin-right: 10px; }
.av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; flex-shrink: 0; font-size: 14px; position: relative; background-size: cover; background-position: center; }
.dot { width: 10px; height: 10px; border-radius: 50%; position: absolute; bottom: -2px; right: -2px; border: 2px solid var(--side); }
.online { background: var(--ok); } .offline { background: var(--mu); }

/* Мой профиль */
#me { padding: 8px 12px; background: var(--rail); display: flex; align-items: center; justify-content: space-between; }
#me-info { display: flex; align-items: center; overflow: hidden; cursor: pointer; padding: 4px; border-radius: 6px; transition: .2s; flex: 1; }
#me-info:hover { background: var(--hov); }
#me-info span { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: 8px; }

/* Главная часть */
#main { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; min-width: 0; }
#chat-header { height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--rail); box-shadow: 0 1px 2px rgba(0,0,0,0.1); z-index: 2; }
#chat-name { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }

#msgs { flex: 1; overflow-y: auto; padding: 16px 16px 8px; display: flex; flex-direction: column; }
.welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--mu); text-align: center; }

/* Сообщения в стиле Discord */
.msg { display: flex; padding: 4px 0; margin-top: 12px; position: relative; }
.msg.cont { margin-top: 0; padding-top: 2px; }
.msg .av { width: 40px; height: 40px; margin-right: 16px; font-size: 16px; }
.msg.cont .av { visibility: hidden; height: 0; margin-top: 0; }
.msg-content { flex: 1; min-width: 0; }
.msg-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.msg-head .nm { font-weight: 600; color: var(--tx); font-size: 15px; }
.msg-head .time { font-size: 12px; color: var(--mu); }
.msg-text { color: var(--tx); line-height: 1.4; word-break: break-word; white-space: pre-wrap; }
.msg-text a { color: #00a8fc; text-decoration: none; }
.msg-text a:hover { text-decoration: underline; }

.msg-img { max-width: min(400px, 100%); max-height: 350px; border-radius: 8px; margin-top: 6px; cursor: pointer; display: block; }
.msg-file { display: flex; align-items: center; gap: 10px; background: var(--side); padding: 10px 14px; border-radius: 8px; margin-top: 6px; color: var(--tx); text-decoration: none; font-weight: 600; font-size: 14px; border: 1px solid var(--rail); max-width: 300px; }
.msg-file:hover { background: var(--hov); }

/* Поле ввода */
#bar { padding: 0 16px 16px; display: flex; align-items: center; background: var(--bg); position: relative; }
.cmp-box { display: flex; align-items: center; background: var(--in); border-radius: 8px; padding: 0 12px; flex: 1; min-height: 44px; }
.icon-btn { background: transparent; color: var(--mu); border: 0; border-radius: 8px; padding: 8px; cursor: pointer; font-size: 20px; transition: .2s; display: flex; align-items: center; justify-content: center; }
.icon-btn:hover { color: var(--tx); }
#in { flex: 1; background: transparent; border: 0; padding: 11px 8px; color: var(--tx); outline: 0; font-size: 15px; }
#btn-send { background: transparent; color: var(--mu); border: 0; cursor: pointer; font-size: 20px; padding: 8px; display: grid; place-items: center; transition: .2s; }
#btn-send:hover { color: var(--tx); }

/* Кнопки и модалки */
button.action { border: 0; border-radius: 4px; padding: 8px 14px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: .2s; font-size: 14px; }
button.br { background: var(--br); color: #fff; }
button.br:hover { filter: brightness(1.1); }
button.sec { background: var(--in); color: var(--tx); }
button.sec:hover { background: var(--hov); }

#modal-bg, #settings-bg, #server-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 300; backdrop-filter: blur(2px); }
.modal { background: var(--bg); padding: 24px; border-radius: 8px; width: 380px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
.modal h3 { margin-bottom: 16px; font-size: 20px; text-align: center; }
.modal input[type=text] { width: 100%; padding: 10px; border-radius: 4px; border: 0; background: var(--in); color: #fff; font-size: 15px; margin-bottom: 16px; outline: 0; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

#login { position: fixed; inset: 0; background: var(--rail); display: flex; align-items: center; justify-content: center; z-index: 200; }
.login-box { background: var(--bg); padding: 32px; border-radius: 8px; width: 380px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
.login-box h1 { margin-bottom: 8px; font-size: 24px; }
.login-box p { color: var(--mu); margin-bottom: 20px; font-size: 14px; }
.login-box input { width: 100%; padding: 12px; border-radius: 4px; border: 0; background: var(--in); color: #fff; font-size: 16px; margin-bottom: 16px; outline: 0; }
.login-box button { width: 100%; padding: 12px; background: var(--br); border: 0; border-radius: 4px; color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; }

/* Звонки */
#call-ui { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: #fff; }
#call-ui.on { display: flex; }
#call-avatar { width: 120px; height: 120px; border-radius: 50%; background: var(--br); display: grid; place-items: center; font-size: 48px; font-weight: 700; margin-bottom: 24px; background-size: cover; background-position: center; }
#call-btns { display: flex; gap: 24px; margin-top: 48px; }
#call-btns button { width: 64px; height: 64px; border-radius: 50%; font-size: 24px; padding: 0; border: 0; cursor: pointer; color: #fff; display: grid; place-items: center; transition: .2s; }
#btn-dec { background: var(--err); } #btn-dec:hover { filter: brightness(1.1); }
#btn-acc { background: var(--ok); } #btn-acc:hover { filter: brightness(1.1); }
#btn-mute { background: var(--mu); color: #fff; } #btn-mute:hover { background: var(--tx); }
.hidden { display: none !important; }

#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--tx); color: var(--bg); padding: 10px 20px; border-radius: 4px; font-weight: 600; font-size: 14px; opacity: 0; transition: opacity 0.3s; z-index: 999; pointer-events: none; text-align: center; }
#toast.show { opacity: 1; }

.spinner { width: 20px; height: 20px; border: 2px solid var(--mu); border-radius: 50%; border-top-color: var(--br); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Скроллбар */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--side); }
::-webkit-scrollbar-thumb { background: var(--rail); border-radius: 4px; }
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

<div id="login">
  <div class="login-box">
    <h1>С возвращением!</h1>
    <p>Мы рады снова видеть вас</p>
    <div id="login-msg" style="color:var(--err);font-size:13px;height:16px;margin-bottom:8px;"></div>
    <input id="username" placeholder="Ваше имя (от 3 символов)" autocomplete="off">
    <button onclick="login()">Войти</button>
  </div>
</div>

<div id="modal-bg">
  <div class="modal">
    <h3>Добавить друга</h3>
    <input type="text" id="friend-id" placeholder="Введите ID друга (например, pepel)" autocomplete="off">
    <div class="modal-actions">
      <button class="action sec" onclick="document.getElementById('modal-bg').style.display='none'">Отмена</button>
      <button class="action br" onclick="confirmAddFriend()">Добавить</button>
    </div>
  </div>
</div>

<div id="settings-bg">
  <div class="modal">
    <h3>Мой профиль</h3>
    <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:20px;">
      <div id="settings-av" style="width:80px;height:80px;border-radius:50%;background:var(--br);display:grid;place-items:center;font-size:32px;font-weight:700;color:#fff;margin-bottom:12px;background-size:cover;background-position:center;cursor:pointer;position:relative;overflow:hidden;">
        <div style="position:absolute;inset:0;background:rgba(0,0,0,0.5);display:grid;place-items:center;opacity:0;transition:.2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0">📷</div>
      </div>
      <input type="file" id="avatar-upload" accept="image/*" style="display:none" onchange="uploadAvatar(this)">
      <button class="action sec" onclick="document.getElementById('avatar-upload').click()" style="font-size:12px">Загрузить фото</button>
    </div>
    <input type="text" id="settings-name" placeholder="Ваше имя" autocomplete="off">
    <div class="modal-actions">
      <button class="action sec" onclick="document.getElementById('settings-bg').style.display='none'">Отмена</button>
      <button class="action br" onclick="saveSettings()">Сохранить</button>
    </div>
  </div>
</div>

<div id="server-bg">
  <div class="modal">
    <h3>Создать сервер</h3>
    <input type="text" id="server-name" placeholder="Название сервера" autocomplete="off">
    <div class="modal-actions">
      <button class="action sec" onclick="document.getElementById('server-bg').style.display='none'">Отмена</button>
      <button class="action br" onclick="createServer()">Создать</button>
    </div>
  </div>
</div>

<div id="rail" style="display:none">
  <div class="sv hm on" id="btn-home" title="Личные сообщения" onclick="switchToFriends()">💬</div>
  <div class="divider"></div>
  <div id="servers-list"></div>
  <div class="sv add" onclick="document.getElementById('server-bg').style.display='flex'" title="Создать сервер">＋</div>
</div>

<div id="side" style="display:none">
  <div class="hd">
    <span id="side-title">Друзья</span>
    <button id="btn-add" class="action br" style="padding:4px 8px;font-size:16px" onclick="document.getElementById('modal-bg').style.display='flex'">➕</button>
  </div>
  <div id="chs"></div>
  <div id="me">
    <div id="me-info" onclick="openSettings()">
      <div class="av" id="my-av">?</div>
      <span id="my-name">Загрузка...</span>
    </div>
    <button onclick="logout()" style="background:transparent;color:var(--mu);border:0;cursor:pointer;font-size:20px;padding:4px" title="Выйти">🚪</button>
  </div>
</div>

<div id="main" style="display:none">
  <div id="chat-header">
    <span id="chat-name">Выберите друга</span>
    <button id="btn-call" class="action sec hidden" onclick="startCall()">📞 Звонок</button>
  </div>
  
  <div id="msgs">
    <div class="welcome">
      <h2>Добро пожаловать!</h2>
      <p>Выберите друга слева или добавьте нового по ID.</p>
    </div>
  </div>

  <div id="bar">
    <div class="cmp-box">
      <button class="icon-btn" onclick="document.getElementById('file-upload').click()" title="Прикрепить файл">📎</button>
      <input type="file" id="file-upload" style="display:none" onchange="uploadFile(this)">
      <input id="in" placeholder="Написать сообщение..." autocomplete="off">
      <button id="btn-send">➤</button>
    </div>
  </div>
</div>

<div id="call-ui">
  <div id="call-avatar">?</div>
  <h2 id="call-title">Звонок...</h2>
  <div style="color:#aaa;margin-top:8px" id="call-status">Соединение...</div>
  <div id="call-btns">
    <button id="btn-acc" class="hidden">✅</button>
    <button id="btn-mute">🎤</button>
    <button id="btn-dec">❌</button>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, getDoc, updateDoc, arrayUnion, limit } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD5vrDqL4tGPzpQDLpy4j2vJepPrVAVFzc",
  authDomain: "wowch-949f8.firebaseapp.com",
  projectId: "wowch-949f8",
  storageBucket: "wowch-949f8.firebasestorage.app",
  messagingSenderId: "1073245247353",
  appId: "1:1073245247353:web:3f79e21d46e67de4c8d828"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let myId = null, myPeerId = null, myAvatar = null, myDisplayName = null;
let friends = [], servers = [];
let activeChat = null;
let unsubMsgs = null, peer = null, onlineUsers = {};
let currentFriendName = '';

const $ = s => document.querySelector(s);

function toast(msg, ms=4000) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

function getColor(str) {
  let hash = 0; for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
  const c = (hash & 0x00FFFFFF).toString(16).toUpperCase();
  return '#' + '00000'.substring(0, 6 - c.length) + c;
}

function createAvatar(name, avatarUrl, statusDot = false, isOnline = false) {
  const av = document.createElement('div');
  av.className = 'av';
  if (avatarUrl) {
    av.style.backgroundImage = `url(${avatarUrl})`;
  } else {
    av.textContent = name[0].toUpperCase();
    av.style.background = getColor(name);
  }
  if (statusDot) {
    const dot = document.createElement('div');
    dot.className = 'dot ' + (isOnline ? 'online' : 'offline');
    av.append(dot);
  }
  return av;
}

// --- ВХОД ---
window.login = async () => {
  const name = $('#username').value.trim();
  if (name.length < 3) return $('#login-msg').textContent = 'Имя должно быть от 3 символов';
  const id = name.toLowerCase().replace(/[^a-z0-9_]/g, '');
  $('#login-msg').textContent = 'Загрузка...';
  
  const userRef = doc(db, 'users', id);
  const snap = await getDoc(userRef);

  if (!snap.exists()) {
    myPeerId = 'peer-' + Math.random().toString(36).slice(2, 10);
    await setDoc(userRef, { id: id, displayName: name, avatar: '', peerId: myPeerId, friends: [], servers: [] });
    friends = []; servers = [];
  } else {
    const data = snap.data();
    myPeerId = data.peerId || ('peer-' + Math.random().toString(36).slice(2, 10));
    friends = data.friends || []; servers = data.servers || [];
    myAvatar = data.avatar; myDisplayName = data.displayName;
    await updateDoc(userRef, { peerId: myPeerId });
  }

  myId = id; myDisplayName = name;
  localStorage.setItem('wowch_uid', myId);
  localStorage.setItem('wowch_name', name);
  
  $('#login').style.display = 'none';
  $('#rail').style.display = 'flex';
  $('#side').style.display = 'flex';
  $('#main').style.display = 'flex';
  
  updateMyUI();

  const onlineRef = doc(db, 'online', myId);
  await setDoc(onlineRef, { t: Date.now() });
  setInterval(() => setDoc(onlineRef, { t: Date.now() }), 15000);

  initPeer();
  switchToFriends();
  listenOnline();
  renderServers();
};

const savedId = localStorage.getItem('wowch_uid');
const savedName = localStorage.getItem('wowch_name');
if (savedId && savedName) { $('#username').value = savedName; login(); }

function updateMyUI() {
  $('#my-name').textContent = myDisplayName;
  const avBox = $('#my-av');
  if (myAvatar) {
    avBox.style.backgroundImage = `url(${myAvatar})`;
    avBox.textContent = '';
  } else {
    avBox.style.backgroundImage = 'none';
    avBox.style.background = getColor(myDisplayName);
    avBox.textContent = myDisplayName[0].toUpperCase();
  }
}

window.logout = () => {
  localStorage.removeItem('wowch_uid');
  localStorage.removeItem('wowch_name');
  location.reload();
};

// --- ПРОФИЛЬ ---
window.openSettings = () => {
  $('#settings-name').value = myDisplayName;
  const av = $('#settings-av');
  if (myAvatar) {
    av.style.backgroundImage = `url(${myAvatar})`;
    av.textContent = '';
  } else {
    av.style.backgroundImage = 'none';
    av.style.background = getColor(myDisplayName);
    av.textContent = myDisplayName[0].toUpperCase();
  }
  av.dataset.newAvatar = '';
  $('#settings-bg').style.display = 'flex';
};

window.uploadAvatar = (input) => {
  if (!input.files || !input.files[0]) return;
  if (input.files[0].size > 200000) return alert('Аватарка должна быть меньше 200 КБ');
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas'); canvas.width = 100; canvas.height = 100;
      const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, 100, 100);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      const av = $('#settings-av');
      av.style.backgroundImage = `url(${dataUrl})`; av.textContent = ''; av.dataset.newAvatar = dataUrl;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(input.files[0]);
};

window.saveSettings = async () => {
  const newName = $('#settings-name').value.trim();
  if (newName.length < 3) return alert('Имя должно быть от 3 символов');
  
  const av = $('#settings-av');
  const newAvatar = av.dataset.newAvatar;
  const updateData = { displayName: newName };
  if (newAvatar) updateData.avatar = newAvatar;
  
  await updateDoc(doc(db, 'users', myId), updateData);
  
  myDisplayName = newName;
  if (newAvatar) myAvatar = newAvatar;
  
  updateMyUI();
  $('#settings-bg').style.display = 'none';
  toast('Профиль сохранен');
  if ($('#side-title').textContent === 'Друзья') renderFriends();
};

// --- СЕРВЕРА ---
window.renderServers = () => {
  const l = $('#servers-list'); l.innerHTML = '';
  servers.forEach(sid => {
    const d = document.createElement('div');
    d.className = 'sv'; d.title = 'Сервер ' + sid; d.textContent = sid[0].toUpperCase();
    d.onclick = () => switchToServer(sid);
    l.append(d);
  });
};

window.createServer = async () => {
  const name = $('#server-name').value.trim();
  if (!name) return;
  const sid = name.toLowerCase().replace(/[^a-z0-9_]/g, '');
  const snap = await getDoc(doc(db, 'servers', sid));
  if (snap.exists()) return alert('Сервер с таким именем уже существует');
  
  await setDoc(doc(db, 'servers', sid), { name: name, creator: myId, channels: ['общий'] });
  await updateDoc(doc(db, 'users', myId), { servers: arrayUnion(sid) });
  servers.push(sid);
  
  $('#server-name').value = '';
  $('#server-bg').style.display = 'none';
  renderServers(); switchToServer(sid);
};

// --- НАВИГАЦИЯ ---
window.switchToFriends = () => {
  document.querySelectorAll('.sv').forEach(el => el.classList.remove('on'));
  $('#btn-home').classList.add('on');
  $('#side-title').textContent = 'Друзья';
  $('#btn-add').style.display = 'block';
  $('#chat-name').textContent = 'Выберите друга';
  $('#btn-call').classList.add('hidden');
  $('#msgs').innerHTML = `<div class="welcome"><h2>Добро пожаловать!</h2><p>Выберите друга слева.</p></div>`;
  activeChat = null;
  if (unsubMsgs) unsubMsgs();
  renderFriends();
};

window.switchToServer = (sid) => {
  document.querySelectorAll('.sv').forEach(el => el.classList.remove('on'));
  $('#side-title').textContent = 'Каналы';
  $('#btn-add').style.display = 'none';
  activeChat = null;
  
  const l = $('#chs'); l.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'ch on';
  d.innerHTML = `<div class="av" style="background:var(--mu);border-radius:4px">#</div> общий`;
  d.onclick = () => openChannel(sid, 'общий');
  l.append(d);
  
  $('#chat-name').textContent = 'Канал #общий';
  $('#btn-call').classList.add('hidden');
  $('#msgs').innerHTML = `<div class="welcome"><h2>Канал сервера</h2><p>Напишите первое сообщение.</p></div>`;
  if (unsubMsgs) unsubMsgs();
  openChannel(sid, 'общий');
};

function openChannel(sid, cid) {
  activeChat = { type: 'channel', id: `${sid}_${cid}`, name: `#${cid}` };
  $('#chat-name').textContent = `#${cid}`;
  $('#btn-call').classList.add('hidden');
  loadMessages();
}

// --- ДРУЗЬЯ ---
function listenOnline() {
  onSnapshot(collection(db, 'online'), snap => {
    onlineUsers = {};
    const now = Date.now();
    snap.forEach(doc => { if (now - doc.data().t < 30000) onlineUsers[doc.id] = true; });
    if ($('#side-title').textContent === 'Друзья') renderFriends(); 
  });
}

window.renderFriends = async () => {
  if ($('#side-title').textContent !== 'Друзья') return;
  const l = $('#chs'); l.innerHTML = '';
  const uniqueFriends = [...new Set(friends)];
  
  for (const fid of uniqueFriends) {
    const snap = await getDoc(doc(db, 'users', fid));
    if (!snap.exists()) continue;
    const fData = snap.data();
    const fName = fData.displayName || fid;
    const isOnline = onlineUsers[fid];

    const d = document.createElement('div');
    d.className = 'ch' + (activeChat?.id === fid ? ' on' : '');
    d.append(createAvatar(fName, fData.avatar, true, isOnline));
    d.append(document.createTextNode(fName));
    
    d.onclick = () => {
      activeChat = { type: 'friend', id: fid, name: fName };
      currentFriendName = fName;
      renderFriends();
      $('#chat-name').textContent = fName;
      $('#btn-call').classList.remove('hidden');
      loadMessages();
    };
    l.append(d);
  }
};

window.confirmAddFriend = async () => {
  const fname = $('#friend-id').value.trim();
  if (!fname) return;
  const fid = fname.toLowerCase().replace(/[^a-z0-9_]/g, '');
  
  if (fid === myId) return alert('Это ваш собственный ID!');
  if (friends.includes(fid)) return alert('Этот друг уже есть в вашем списке!');

  const snap = await getDoc(doc(db, 'users', fid));
  if (!snap.exists()) return alert('Пользователь с таким ID не найден.');

  friends.push(fid);
  await updateDoc(doc(db, 'users', myId), { friends: arrayUnion(fid) });
  
  $('#friend-id').value = '';
  $('#modal-bg').style.display = 'none';
  renderFriends();
};

// --- ЧАТ ---
function loadMessages() {
  if (!activeChat) return;
  const msgsBox = $('#msgs');
  msgsBox.innerHTML = ''; 
  if (unsubMsgs) unsubMsgs();

  const chatId = activeChat.type === 'friend' ? [myId, activeChat.id].sort().join('_') : activeChat.id;
  const q = query(collection(db, 'chats', chatId, 'messages'), orderBy('t', 'asc'), limit(100));

  let lastUid = null; let lastTime = 0;
  unsubMsgs = onSnapshot(q, snap => {
    msgsBox.innerHTML = '';
    lastUid = null; lastTime = 0;
    
    snap.forEach(doc => {
      const m = doc.data();
      const isMe = m.uid === myId;
      const isCont = m.uid === lastUid && (m.t - lastTime) < 300000; 
      lastUid = m.uid; lastTime = m.t;

      const msg = document.createElement('div');
      msg.className = 'msg' + (isCont ? ' cont' : '');
      
      const av = createAvatar(isMe ? myDisplayName : (m.name || 'U'), isMe ? myAvatar : m.avatar);
      msg.append(av);
      
      const content = document.createElement('div');
      content.className = 'msg-content';
      
      if (!isCont) {
        const head = document.createElement('div');
        head.className = 'msg-head';
        const nm = document.createElement('span'); nm.className = 'nm';
        nm.textContent = isMe ? myDisplayName : (m.name || activeChat.name);
        nm.style.color = getColor(isMe ? myDisplayName : (m.name || activeChat.name));
        const time = document.createElement('span'); time.className = 'time';
        time.textContent = new Date(m.t).toLocaleTimeString('ru', {hour:'2-digit',minute:'2-digit'});
        head.append(nm, time);
        content.append(head);
      }
      
      if (m.text) {
        const txt = document.createElement('div');
        txt.className = 'msg-text';
        // Замена ссылок на кликабельные
        txt.innerHTML = m.text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
        content.append(txt);
      }
      
      if (m.file) {
        if (m.fileType?.startsWith('image/')) {
          const img = document.createElement('img');
          img.src = m.file; img.className = 'msg-img';
          img.onclick = () => window.open(m.file, '_blank');
          content.append(img);
        } else {
          const file = document.createElement('a');
          file.href = m.file; file.download = m.fileName;
          file.className = 'msg-file';
          file.innerHTML = `📄 ${m.fileName}`;
          content.append(file);
        }
      }
      
      msg.append(content);
      msgsBox.append(msg);
    });
    msgsBox.scrollTop = msgsBox.scrollHeight;
  });
}

window.sendMsg = async () => {
  const txt = $('#in').value.trim();
  if (!txt || !activeChat) return;
  $('#in').value = '';
  
  const chatId = activeChat.type === 'friend' ? [myId, activeChat.id].sort().join('_') : activeChat.id;
  await addDoc(collection(db, 'chats', chatId, 'messages'), {
    uid: myId, name: myDisplayName, avatar: myAvatar, text: txt, t: Date.now()
  });
};
$('#btn-send').onclick = window.sendMsg;
$('#in').onkeydown = e => { if (e.key === 'Enter') window.sendMsg(); };

// --- ФАЙЛЫ ---
window.uploadFile = (input) => {
  if (!input.files || !input.files[0] || !activeChat) return;
  const file = input.files[0];
  if (file.size > 800000) return alert('Файл должен быть меньше 800 КБ');
  
  const reader = new FileReader();
  reader.onload = async (e) => {
    const btn = $('#btn-send'); btn.innerHTML = '<div class="spinner"></div>';
    const chatId = activeChat.type === 'friend' ? [myId, activeChat.id].sort().join('_') : activeChat.id;
    await addDoc(collection(db, 'chats', chatId, 'messages'), {
      uid: myId, name: myDisplayName, avatar: myAvatar, 
      file: e.target.result, fileType: file.type, fileName: file.name, t: Date.now()
    });
    btn.innerHTML = '➤'; input.value = '';
  };
  reader.readAsDataURL(file);
};

// --- ЗВОНКИ ---
function initPeer() {
  fetch('https://wowch-calls.onrender.com').catch(() => {});
  peer = new Peer(myPeerId, {
    host: 'wowch-calls.onrender.com', port: 443, path: '/', secure: true,
    config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
  });
  peer.on('open', (id) => console.log('Готов к звонкам. ID:', id));
  peer.on('error', err => console.log('Ошибка звонка:', err.type));
  peer.on('call', call => {
    $('#call-title').textContent = 'Входящий звонок';
    $('#call-avatar').textContent = '?'; 
    $('#call-ui').classList.add('on');
    $('#btn-acc').classList.remove('hidden');
    $('#btn-acc').onclick = () => {
      navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        call.answer(stream); setupCallUI(call);
      });
    };
  });
}

window.startCall = async () => {
  if (!activeChat || activeChat.type !== 'friend') return;
  const snap = await getDoc(doc(db, 'users', activeChat.id));
  if (!snap.exists() || !snap.data().peerId) return alert('Друг не в сети.');
  
  toast('Если соединение висит — сервер просыпается (до 30 сек).');
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    $('#call-title').textContent = 'Звоним...';
    $('#call-status').textContent = 'Ожидание ответа...';
    const av = $('#call-avatar');
    if (snap.data().avatar) { av.style.backgroundImage = `url(${snap.data().avatar})`; av.textContent = ''; }
    else { av.style.backgroundImage = 'none'; av.style.background = getColor(currentFriendName); av.textContent = currentFriendName[0].toUpperCase(); }
    $('#call-ui').classList.add('on');
    const call = peer.call(snap.data().peerId, stream);
    setupCallUI(call);
  }).catch(() => alert('Нет доступа к микрофону!'));
};

function setupCallUI(call) {
  call.on('stream', remote => {
    $('#call-title').textContent = 'Разговор';
    $('#call-status').textContent = 'Соединено';
    const audio = new Audio(); audio.srcObject = remote; audio.play();
  });
  call.on('close', () => { $('#call-ui').classList.remove('on'); });
}
$('#btn-dec').onclick = () => { if (peer) peer.destroy(), initPeer(); $('#call-ui').classList.remove('on'); };
</script>
