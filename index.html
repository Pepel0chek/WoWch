<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WoWCh</title>
<style>
:root{--bg:#313338;--side:#2b2d31;--rail:#1e1f22;--tx:#dbdee1;--mu:#949ba4;--in:#383a40;--hov:#3a3c43;--br:#5865f2;--ok:#23a559;--err:#da373c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 Arial,sans-serif;height:100vh;display:flex;overflow:hidden}
#side{width:260px;background:var(--side);display:flex;flex-direction:column;border-right:1px solid var(--rail)}
.hd{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:700;border-bottom:1px solid var(--rail)}
#main{flex:1;display:flex;flex-direction:column}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{padding:8px 12px;border-radius:8px;max-width:80%;word-break:break-word}
.msg.me{background:var(--br);color:#fff;align-self:flex-end}
.msg.them{background:var(--rail);align-self:flex-start}
.msg .nm{font-size:12px;font-weight:700;opacity:0.7;margin-bottom:4px}
#bar{padding:16px;background:var(--side);display:flex;gap:12px}
#in{flex:1;background:var(--in);border:0;border-radius:8px;padding:12px;color:var(--tx);outline:0;font-size:15px}
button{background:var(--br);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;display:grid;place-items:center}
button:hover{filter:brightness(1.1)}
button.sec{background:var(--in);color:var(--tx)}
#conn{font-size:12px;color:var(--mu);padding:8px 16px;background:var(--side);border-top:1px solid var(--rail)}

#call-ui{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;color:#fff}
#call-ui.on{display:flex}
#call-ui h2{margin-bottom:16px;font-size:24px}
#call-btns{display:flex;gap:16px;margin-top:32px}
#call-btns button{width:64px;height:64px;border-radius:50%;font-size:24px;padding:0}
#btn-dec{background:var(--err)}
#btn-acc{background:var(--ok)}
.hidden{display:none!important}
</style>
<!-- Подключаем библиотеку для WebRTC (звонки) -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

<div id="side">
  <div class="hd">
    <span>WoWCh</span>
    <button id="btn-id" style="padding:4px 8px;font-size:12px">🆔 Мой ID</button>
  </div>
  <div style="padding:16px;color:var(--mu);font-size:14px" id="my-info">
    Загрузка...
  </div>
</div>

<div id="main">
  <div class="hd">
    <span id="chat-name">Чат</span>
    <button id="btn-call" class="sec">📞 Звонок</button>
  </div>
  <div id="msgs">
    <div style="color:var(--mu);text-align:center;margin-top:20px">Нажмите «🆔 Мой ID», чтобы начать.</div>
  </div>
  <div id="bar">
    <input id="in" placeholder="Написать сообщение..." autocomplete="off">
    <button id="btn-send">➤</button>
  </div>
  <div id="conn">Ожидание подключения...</div>
</div>

<div id="call-ui">
  <h2 id="call-title">Звонок...</h2>
  <div style="color:#aaa" id="call-status">Соединение...</div>
  <div id="call-btns">
    <button id="btn-acc" class="hidden">✅</button>
    <button id="btn-mute">🎤</button>
    <button id="btn-dec">❌</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

// ТВОИ КЛЮЧИ ИЗ FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyD5vrDqL4tGPzpQDLpy4j2vJepPrVAVFzc",
  authDomain: "wowch-949f8.firebaseapp.com",
  projectId: "wowch-949f8",
  storageBucket: "wowch-949f8.firebasestorage.app",
  messagingSenderId: "1073245247353",
  appId: "1:1073245247353:web:3f79e21d46e67de4c8d828"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let myId = localStorage.getItem('wowch_uid') || 'user-' + Math.random().toString(36).slice(2,8);
localStorage.setItem('wowch_uid', myId);
let peerId = localStorage.getItem('wowch_peer') || 'peer-' + Math.random().toString(36).slice(2,10);
localStorage.setItem('wowch_peer', peerId);

let friendId = null;
let unsubMsgs = null;
let peer = null;
let currentCall = null;
let micStream = null;
let muted = false;

const $ = s => document.querySelector(s);

// Инициализация звонков (с защитой от сбоев)
function initPeer() {
  peer = new Peer(peerId, {
    config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] }
  });

  peer.on('open', id => {
    $('#my-info').innerHTML = `<b>Ваш ID:</b> ${myId}`;
    $('#conn').textContent = 'Готов к работе (Звонки и Чат активны)';
    $('#conn').style.color = 'var(--ok)';
  });

  peer.on('call', call => {
    if (currentCall) { call.close(); return; }
    $('#call-title').textContent = 'Входящий звонок';
    $('#call-status').textContent = 'Нажмите ✅ чтобы принять';
    $('#call-ui').classList.add('on');
    $('#btn-acc').classList.remove('hidden');
    
    $('#btn-acc').onclick = () => {
      navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        micStream = stream;
        call.answer(stream);
        currentCall = call;
        $('#btn-acc').classList.add('hidden');
        $('#call-title').textContent = 'Разговор';
        $('#call-status').textContent = 'Соединено';
        bindCallEvents(call);
      }).catch(err => { alert('Нет доступа к микрофону'); call.close(); });
    };
  });

  peer.on('error', err => {
    console.log('Ошибка звонка:', err);
    endCall();
  });
}

function bindCallEvents(call) {
  call.on('stream', remoteStream => {
    const audio = new Audio();
    audio.srcObject = remoteStream;
    audio.play();
  });
  call.on('close', endCall);
  call.on('error', endCall);
}

async function startCall() {
  if (!friendId) return alert('Сначала укажите ID друга (кнопка 🆔).');
  if (currentCall) return;
  if (!peer) initPeer();

  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    return alert('Нет доступа к микрофону');
  }

  const friendPeerId = localStorage.getItem('peer_' + friendId) || friendId;
  $('#call-title').textContent = 'Звоним...';
  $('#call-ui').classList.add('on');

  currentCall = peer.call(friendPeerId, micStream);
  bindCallEvents(currentCall);
}

function endCall() {
  if (currentCall) { currentCall.close(); currentCall = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  $('#call-ui').classList.remove('on');
  $('#btn-acc').classList.add('hidden');
}

// Чат (Firebase)
function openChat() {
  const target = prompt("Введите ID друга (например, user-abc123):");
  if (!target || target === myId) return;
  friendId = target;
  localStorage.setItem('friend_id', friendId);
  if (unsubMsgs) unsubMsgs();

  const chatId = [myId, friendId].sort().join('_');
  $('#chat-name').textContent = 'Чат с ' + friendId;
  
  const q = query(collection(db, 'chats', chatId, 'messages'), orderBy('t', 'asc'));
  unsubMsgs = onSnapshot(q, snap => {
    const msgs = $('#msgs');
    msgs.innerHTML = '';
    snap.forEach(doc => {
      const m = doc.data();
      const div = document.createElement('div');
      div.className = 'msg ' + (m.uid === myId ? 'me' : 'them');
      div.innerHTML = `<div class="nm">${m.name}</div>${m.text}`;
      msgs.append(div);
    });
    msgs.scrollTop = msgs.scrollHeight;
  });
}

async function sendMsg() {
  const inp = $('#in');
  const text = inp.value.trim();
  if (!text || !friendId) return;
  inp.value = '';
  const chatId = [myId, friendId].sort().join('_');
  await addDoc(collection(db, 'chats', chatId, 'messages'), {
    uid: myId, name: myId, text, t: Date.now()
  });
}

async function savePeerId() {
  await setDoc(doc(db, 'peers', myId), { peerId, t: Date.now() });
}

async function getFriendPeerId(id) {
  const d = await getDoc(doc(db, 'peers', id));
  return d.exists() ? d.data().peerId : null;
}

initPeer();
savePeerId();

$('#btn-id').onclick = openChat;
$('#btn-send').onclick = sendMsg;
$('#in').onkeydown = e => { if (e.key === 'Enter') sendMsg(); };
$('#btn-call').onclick = async () => {
  if (!friendId) return openChat();
  const fp = await getFriendPeerId(friendId);
  if (!fp) return alert('Друг еще не заходил в приложение. Его Peer ID не найден.');
  localStorage.setItem('peer_' + friendId, fp);
  startCall();
};
$('#btn-dec').onclick = endCall;
$('#btn-mute').onclick = () => {
  muted = !muted;
  if (micStream) micStream.getAudioTracks().forEach(t => t.enabled = !muted);
  $('#btn-mute').textContent = muted ? '🔇' : '🎤';
};
</script>
</body>
</html>
