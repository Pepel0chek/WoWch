<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WoWCh</title>
<meta name="theme-color" content="#5865f2">
<style>
:root {
  --bg: #313338; --side: #2b2d31; --rail: #1e1f22; --tx: #dbdee1; --mu: #949ba4;
  --in: #383a40; --hov: #3a3c43; --br: #5865f2; --ok: #23a559; --err: #da373c;
  --bubble-me: #5865f2; --bubble-them: #2b2d31;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
body { background: var(--bg); color: var(--tx); height: 100vh; display: flex; overflow: hidden; font-size: 15px; }

/* Левая панель */
#rail { width: 72px; background: var(--rail); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 8px; z-index: 10; }
.sv { width: 48px; height: 48px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-weight: 700; cursor: pointer; transition: .2s; font-size: 20px; }
.sv.on, .sv:hover { border-radius: 15px; background: var(--br); color: #fff; }

/* Список друзей */
#side { width: 260px; background: var(--side); display: flex; flex-direction: column; z-index: 5; border-right: 1px solid var(--rail); }
.hd { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-weight: 700; border-bottom: 1px solid var(--rail); font-size: 16px; }
#chs { flex: 1; overflow-y: auto; padding: 8px; }
.ch { display: flex; align-items: center; padding: 8px; border-radius: 6px; cursor: pointer; color: var(--mu); font-weight: 600; margin-bottom: 4px; transition: .1s; }
.ch:hover, .ch.on { background: var(--hov); color: var(--tx); }
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; margin-right: 12px; flex-shrink: 0; font-size: 15px; position: relative; }
.dot { width: 12px; height: 12px; border-radius: 50%; position: absolute; bottom: 0; right: 0; border: 2px solid var(--side); }
.online { background: var(--ok); } .offline { background: var(--mu); }

#me { padding: 12px; background: var(--rail); display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--side); }
#me-info { display: flex; align-items: center; overflow: hidden; }
#me-info span { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#logout { background: transparent; color: var(--mu); border: 0; cursor: pointer; font-size: 20px; padding: 4px; transition: .2s; }
#logout:hover { color: var(--err); }

/* Главная часть */
#main { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; }
#chat-header { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--rail); box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
#chat-name { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }

#msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--mu); text-align: center; }
.welcome h2 { color: var(--tx); margin-bottom: 8px; }

.msg-row { display: flex; margin-bottom: 4px; max-width: 85%; }
.msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
.msg-row.them { align-self: flex-start; }
.msg-bubble { padding: 10px 14px; border-radius: 12px; line-height: 1.4; word-break: break-word; position: relative; }
.msg-row.me .msg-bubble { background: var(--bubble-me); color: #fff; border-bottom-right-radius: 2px; }
.msg-row.them .msg-bubble { background: var(--bubble-them); border-bottom-left-radius: 2px; }
.msg-author { font-size: 12px; font-weight: 700; color: var(--mu); margin-bottom: 4px; margin-left: 4px; }
.msg-row.me .msg-author { display: none; }

#bar { padding: 16px; display: flex; gap: 12px; }
#in { flex: 1; background: var(--in); border: 0; border-radius: 10px; padding: 14px; color: var(--tx); outline: 0; font-size: 15px; box-shadow: inset 0 1px 2px rgba(0,0,0,0.1); }
#in:focus { box-shadow: inset 0 1px 2px rgba(0,0,0,0.1), 0 0 0 2px rgba(88,101,242,0.3); }
#btn-send { background: var(--br); color: #fff; border: 0; border-radius: 10px; padding: 0 20px; cursor: pointer; font-size: 20px; display: grid; place-items: center; transition: .2s; }
#btn-send:hover { filter: brightness(1.1); }

/* Кнопки */
button.action { border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: .2s; }
button.sec { background: var(--in); color: var(--tx); }
button.sec:hover { background: var(--hov); }
button.br { background: var(--br); color: #fff; }
button.br:hover { filter: brightness(1.1); }

/* Модальное окно */
#modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 300; }
.modal { background: var(--bg); padding: 24px; border-radius: 12px; width: 320px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
.modal h3 { margin-bottom: 16px; font-size: 18px; }
.modal input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--rail); background: var(--in); color: #fff; font-size: 15px; margin-bottom: 16px; outline: 0; }
.modal input:focus { border-color: var(--br); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

/* Авторизация */
#login { position: fixed; inset: 0; background: var(--rail); display: flex; align-items: center; justify-content: center; z-index: 200; }
.login-box { background: var(--bg); padding: 32px; border-radius: 12px; width: 340px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
.login-box h1 { margin-bottom: 8px; font-size: 24px; }
.login-box p { color: var(--mu); margin-bottom: 20px; font-size: 14px; }
.login-box input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--rail); background: var(--in); color: #fff; font-size: 16px; margin-bottom: 16px; outline: 0; }
.login-box input:focus { border-color: var(--br); }
.login-box button { width: 100%; padding: 12px; background: var(--br); border: 0; border-radius: 8px; color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; }
.login-box button:hover { filter: brightness(1.1); }
#login-msg { color: var(--err); font-size: 13px; height: 16px; margin-bottom: 8px; }

/* Звонки */
#call-ui { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: #fff; }
#call-ui.on { display: flex; }
#call-avatar { width: 100px; height: 100px; border-radius: 50%; background: var(--br); display: grid; place-items: center; font-size: 40px; font-weight: 700; margin-bottom: 20px; }
#call-btns { display: flex; gap: 20px; margin-top: 40px; }
#call-btns button { width: 64px; height: 64px; border-radius: 50%; font-size: 24px; padding: 0; border: 0; cursor: pointer; color: #fff; display: grid; place-items: center; transition: .2s; }
#btn-dec { background: var(--err); } #btn-dec:hover { filter: brightness(1.1); }
#btn-acc { background: var(--ok); } #btn-acc:hover { filter: brightness(1.1); }
#btn-mute { background: var(--in); color: var(--tx); } #btn-mute:hover { background: var(--hov); }
.hidden { display: none !important; }

@media (max-width: 600px) {
  #rail { display: none; }
  #side { width: 80px; }
  #side .hd span { display: none; }
  #side .hd { justify-content: center; padding: 0; }
  #me-info span { display: none; }
  #me { justify-content: center; }
  .ch { justify-content: center; padding: 8px 0; font-size: 0; }
  .av { margin-right: 0; }
}

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: var(--rail); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

<!-- Окно входа -->
<div id="login">
  <div class="login-box">
    <h1>С возвращением!</h1>
    <p>Мы рады снова видеть вас</p>
    <div id="login-msg"></div>
    <input id="username" placeholder="Ваше имя (от 3 символов)" autocomplete="off">
    <button onclick="login()">Войти</button>
  </div>
</div>

<!-- Окно добавления друга -->
<div id="modal-bg">
  <div class="modal">
    <h3>Добавить друга</h3>
    <input id="friend-id" placeholder="Введите ID друга (например, pepel)" autocomplete="off">
    <div class="modal-actions">
      <button class="action sec" onclick="document.getElementById('modal-bg').style.display='none'">Отмена</button>
      <button class="action br" onclick="confirmAddFriend()">Добавить</button>
    </div>
  </div>
</div>

<div id="rail" style="display:none">
  <div class="sv on" title="Друзья">💬</div>
</div>

<div id="side" style="display:none">
  <div class="hd">
    <span>Друзья</span>
    <button id="btn-add" class="action br" style="padding:4px 10px;font-size:12px">➕</button>
  </div>
  <div id="chs"></div>
  <div id="me">
    <div id="me-info">
      <div class="av" id="my-av">?</div>
      <span id="my-name">Загрузка...</span>
    </div>
    <button id="logout" title="Выйти">🚪</button>
  </div>
</div>

<div id="main" style="display:none">
  <div id="chat-header">
    <span id="chat-name">Выберите друга</span>
    <button id="btn-call" class="action sec hidden">📞 Позвонить</button>
  </div>
  
  <div id="msgs">
    <div class="welcome">
      <h2>Добро пожаловать!</h2>
      <p>Выберите друга слева или добавьте нового по ID.</p>
    </div>
  </div>

  <div id="bar">
    <input id="in" placeholder="Написать сообщение..." autocomplete="off">
    <button id="btn-send">➤</button>
  </div>
</div>

<div id="call-ui">
  <div id="call-avatar">?</div>
  <h2 id="call-title">Звонок...</h2>
  <div style="color:#aaa;margin-top:8px" id="call-status">Соединение...</div>
  <div id="call-btns">
    <button id="btn-acc" class="hidden">✅</button>
    <button id="btn-mute">🎤</button>
    <button id="btn-dec">❌</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD5vrDqL4tGPzpQDLpy4j2vJepPrVAVFzc",
  authDomain: "wowch-949f8.firebaseapp.com",
  projectId: "wowch-949f8",
  storageBucket: "wowch-949f8.firebasestorage.app",
  messagingSenderId: "1073245247353",
  appId: "1:1073245247353:web:3f79e21d46e67de4c8d828"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let myId = null;
let myPeerId = null;
let friends = []; 
let activeFriend = null; 
let unsubMsgs = null;
let peer = null;
let onlineUsers = {};

const $ = s => document.querySelector(s);

function getColor(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
  const c = (hash & 0x00FFFFFF).toString(16).toUpperCase();
  return '#' + '00000'.substring(0, 6 - c.length) + c;
}

// --- ВХОД ---
window.login = async () => {
  const name = $('#username').value.trim();
  if (name.length < 3) return $('#login-msg').textContent = 'Имя должно быть от 3 символов';
  
  const id = name.toLowerCase().replace(/[^a-z0-9_]/g, '');
  $('#login-msg').textContent = 'Загрузка...';
  
  const userRef = doc(db, 'users', id);
  const snap = await getDoc(userRef);

  if (!snap.exists()) {
    myPeerId = 'peer-' + Math.random().toString(36).slice(2, 10);
    await setDoc(userRef, { id: id, displayName: name, peerId: myPeerId, friends: [] });
    friends = [];
  } else {
    myPeerId = snap.data().peerId || ('peer-' + Math.random().toString(36).slice(2, 10));
    friends = snap.data().friends || [];
    await updateDoc(userRef, { peerId: myPeerId, displayName: name });
  }

  myId = id;
  localStorage.setItem('wowch_uid', myId);
  localStorage.setItem('wowch_name', name);
  
  $('#login').style.display = 'none';
  $('#rail').style.display = 'flex';
  $('#side').style.display = 'flex';
  $('#main').style.display = 'flex';
  
  $('#my-name').textContent = name;
  $('#my-av').textContent = name[0].toUpperCase();
  $('#my-av').style.background = getColor(name);

  const onlineRef = doc(db, 'online', myId);
  await setDoc(onlineRef, { t: Date.now() });
  setInterval(() => setDoc(onlineRef, { t: Date.now() }), 15000);

  initPeer();
  renderFriends();
  listenOnline();
};

const savedId = localStorage.getItem('wowch_uid');
const savedName = localStorage.getItem('wowch_name');
if (savedId && savedName) {
  $('#username').value = savedName;
  login();
}

$('#logout').onclick = () => {
  localStorage.removeItem('wowch_uid');
  localStorage.removeItem('wowch_name');
  location.reload();
};

// --- ОНЛАЙН ---
function listenOnline() {
  onSnapshot(collection(db, 'online'), snap => {
    onlineUsers = {};
    const now = Date.now();
    snap.forEach(doc => {
      if (now - doc.data().t < 30000) onlineUsers[doc.id] = true;
    });
    renderFriends(); 
  });
}

// --- ДРУЗЬЯ ---
window.renderFriends = async () => {
  const l = $('#chs'); l.innerHTML = '';
  const uniqueFriends = [...new Set(friends)]; // Убираем дубликаты при отрисовке
  
  for (const fid of uniqueFriends) {
    const snap = await getDoc(doc(db, 'users', fid));
    if (!snap.exists()) continue;
    const fData = snap.data();
    const fName = fData.displayName || fid;
    const isOnline = onlineUsers[fid];

    const d = document.createElement('div');
    d.className = 'ch' + (activeFriend === fid ? ' on' : '');
    
    const av = document.createElement('div');
    av.className = 'av';
    av.textContent = fName[0].toUpperCase();
    av.style.background = getColor(fName);
    
    const dot = document.createElement('div');
    dot.className = 'dot ' + (isOnline ? 'online' : 'offline');
    av.append(dot);

    d.append(av, document.createTextNode(fName));
    d.onclick = () => openChat(fid, fName);
    l.append(d);
  }
};

window.confirmAddFriend = async () => {
  const fname = $('#friend-id').value.trim();
  if (!fname) return;
  const fid = fname.toLowerCase().replace(/[^a-z0-9_]/g, '');
  
  if (fid === myId) return alert('Это ваш собственный ID!');
  if (friends.includes(fid)) return alert('Этот друг уже есть в вашем списке!');

  const snap = await getDoc(doc(db, 'users', fid));
  if (!snap.exists()) return alert('Пользователь с таким ID не найден.');

  friends.push(fid);
  await updateDoc(doc(db, 'users', myId), { friends: arrayUnion(fid) });
  
  $('#friend-id').value = '';
  $('#modal-bg').style.display = 'none';
  renderFriends();
};

$('#btn-add').onclick = () => {
  $('#friend-id').value = '';
  $('#modal-bg').style.display = 'flex';
  $('#friend-id').focus();
};

// --- ЧАТ ---
let currentFriendName = '';
function openChat(fid, fname) {
  activeFriend = fid;
  currentFriendName = fname;
  renderFriends();
  
  $('#chat-name').textContent = fname;
  $('#btn-call').classList.remove('hidden');
  
  const msgsBox = $('#msgs');
  msgsBox.innerHTML = ''; 

  if (unsubMsgs) unsubMsgs();

  const chatId = [myId, fid].sort().join('_');
  const q = query(collection(db, 'chats', chatId, 'messages'), orderBy('t', 'asc'));

  unsubMsgs = onSnapshot(q, snap => {
    msgsBox.innerHTML = '';
    snap.forEach(doc => {
      const m = doc.data();
      const isMe = m.uid === myId;
      
      const row = document.createElement('div');
      row.className = 'msg-row ' + (isMe ? 'me' : 'them');
      
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = m.text;
      
      if (!isMe) {
        const author = document.createElement('div');
        author.className = 'msg-author';
        author.textContent = fname;
        row.append(author, bubble);
      } else {
        row.append(bubble);
      }
      
      msgsBox.append(row);
    });
    msgsBox.scrollTop = msgsBox.scrollHeight;
  });
}

window.sendMsg = async () => {
  const txt = $('#in').value.trim();
  if (!txt || !activeFriend) return;
  $('#in').value = '';
  const chatId = [myId, activeFriend].sort().join('_');
  await addDoc(collection(db, 'chats', chatId, 'messages'), {
    uid: myId, text: txt, t: Date.now()
  });
};
$('#btn-send').onclick = window.sendMsg;
$('#in').onkeydown = e => { if (e.key === 'Enter') window.sendMsg(); };

// --- ЗВОНКИ ---
function initPeer() {
  peer = new Peer(myPeerId, {
    host: 'wowch-calls.onrender.com',
    port: 443,
    path: '/',
    secure: true,
    config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
  });
  
  peer.on('open', (id) => console.log('Готов к звонкам. ID:', id));
  peer.on('error', err => console.log('Ошибка звонка:', err.type));

  peer.on('call', call => {
    $('#call-title').textContent = 'Входящий звонок';
    $('#call-avatar').textContent = '?'; 
    $('#call-ui').classList.add('on');
    $('#btn-acc').classList.remove('hidden');
    $('#btn-acc').onclick = () => {
      navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        call.answer(stream);
        setupCallUI(call);
      });
    };
  });
}

async function getFriendPeerId(fid) {
  const snap = await getDoc(doc(db, 'users', fid));
  return snap.exists() ? snap.data().peerId : null;
}

window.startCall = async () => {
  if (!activeFriend) return;
  const fidPeerId = await getFriendPeerId(activeFriend);
  if (!fidPeerId) return alert('Друг не в сети (не заходил на сайт).');

  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    $('#call-title').textContent = 'Звоним...';
    $('#call-status').textContent = 'Ожидание ответа...';
    $('#call-avatar').textContent = currentFriendName[0].toUpperCase();
    $('#call-avatar').style.background = getColor(currentFriendName);
    $('#call-ui').classList.add('on');
    
    const call = peer.call(fidPeerId, stream);
    setupCallUI(call);
  }).catch(() => alert('Нет доступа к микрофону!'));
};

function setupCallUI(call) {
  call.on('stream', remote => {
    $('#call-title').textContent = 'Разговор';
    $('#call-status').textContent = 'Соединено';
    const audio = new Audio(); audio.srcObject = remote; audio.play();
  });
  call.on('close', () => { $('#call-ui').classList.remove('on'); });
}
$('#btn-call').onclick = window.startCall;
$('#btn-dec').onclick = () => { if (peer) peer.destroy(), initPeer(); $('#call-ui').classList.remove('on'); };
</script>
</body>
</html>
