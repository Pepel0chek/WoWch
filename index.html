<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WoWCh</title>
<style>
:root{--bg:#313338;--side:#2b2d31;--rail:#1e1f22;--tx:#dbdee1;--mu:#949ba4;--in:#383a40;--hov:#3a3c43;--br:#5865f2;--ok:#23a559;--err:#da373c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 Arial,sans-serif;height:100vh;display:flex;overflow:hidden}

/* Левая панель с серверами */
#rail{width:72px;background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:8px}
.sv{width:48px;height:48px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;cursor:pointer;transition:.2s}
.sv.on,.sv:hover{border-radius:15px;background:var(--br);color:#fff}

#side{width:240px;background:var(--side);display:flex;flex-direction:column;border-right:1px solid var(--rail)}
.hd{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:700;border-bottom:1px solid var(--rail)}
#chs{flex:1;overflow-y:auto;padding:10px}
.ch{display:flex;align-items:center;padding:8px;border-radius:4px;cursor:pointer;color:var(--mu);font-weight:600;margin-bottom:2px}
.ch:hover,.ch.on{background:var(--hov);color:var(--tx)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;margin-right:10px;background:var(--br);flex-shrink:0}

#main{flex:1;display:flex;flex-direction:column}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{padding:8px 12px;border-radius:8px;max-width:80%;word-break:break-word}
.msg.me{background:var(--br);color:#fff;align-self:flex-end}
.msg.them{background:var(--rail);align-self:flex-start}
.msg .nm{font-size:12px;font-weight:700;opacity:0.7;margin-bottom:4px}
#bar{padding:16px;background:var(--side);display:flex;gap:12px}
#in{flex:1;background:var(--in);border:0;border-radius:8px;padding:12px;color:var(--tx);outline:0;font-size:15px}
button{background:var(--br);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;display:grid;place-items:center}
button:hover{filter:brightness(1.1)}
button.sec{background:var(--in);color:var(--tx)}
button.err{background:var(--err)}
#conn{font-size:12px;color:var(--mu);padding:8px 16px;background:var(--side);border-top:1px solid var(--rail)}

/* Экран входа */
#login{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200}
#login h1{margin-bottom:20px}
#login input{padding:12px;border-radius:8px;border:0;background:var(--in);color:#fff;font-size:16px;margin-bottom:10px;width:250px}
#login button{width:250px}

/* Звонки */
#call-ui{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;color:#fff}
#call-ui.on{display:flex}
#call-btns{display:flex;gap:20px;margin-top:40px}
#call-btns button{width:64px;height:64px;border-radius:50%;font-size:24px;padding:0}
#btn-dec{background:var(--err)}
#btn-acc{background:var(--ok)}
.hidden{display:none!important}
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

<!-- Экран входа -->
<div id="login">
  <h1>Добро пожаловать в WoWCh</h1>
  <p style="color:var(--mu);margin-bottom:20px" id="login-msg">Придумайте ваш уникальный ID</p>
  <input id="username" placeholder="Например: superman" autocomplete="off">
  <button onclick="login()">Войти</button>
</div>

<div id="rail">
  <div class="sv on" title="Друзья">👥</div>
</div>

<div id="side">
  <div class="hd">
    <span>Друзья</span>
    <button id="btn-add" style="padding:4px 8px;font-size:12px">➕ Добавить</button>
  </div>
  <div id="chs"></div>
</div>

<div id="main">
  <div class="hd">
    <span id="chat-name">Выберите друга</span>
    <button id="btn-call" class="sec" style="display:none">📞 Звонок</button>
  </div>
  <div id="msgs">
    <div style="color:var(--mu);text-align:center;margin-top:20px">Добавьте друга по ID, чтобы начать общение.</div>
  </div>
  <div id="bar">
    <input id="in" placeholder="Написать сообщение..." autocomplete="off">
    <button id="btn-send">➤</button>
  </div>
  <div id="conn">Оффлайн</div>
</div>

<div id="call-ui">
  <h2 id="call-title">Звонок...</h2>
  <div style="color:#aaa" id="call-status">Соединение...</div>
  <div id="call-btns">
    <button id="btn-acc" class="hidden">✅</button>
    <button id="btn-mute">🎤</button>
    <button id="btn-dec">❌</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD5vrDqL4tGPzpQDLpy4j2vJepPrVAVFzc",
  authDomain: "wowch-949f8.firebaseapp.com",
  projectId: "wowch-949f8",
  storageBucket: "wowch-949f8.firebasestorage.app",
  messagingSenderId: "1073245247353",
  appId: "1:1073245247353:web:3f79e21d46e67de4c8d828"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let myId = null;
let myPeerId = null;
let friends = []; // массив ID друзей
let activeFriend = null; // ID открытого чата
let unsubMsgs = null;
let peer = null;

const $ = s => document.querySelector(s);

// --- АВТОРИЗАЦИЯ (ВХОД) ---
window.login = async () => {
  const name = $('#username').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
  if (name.length < 3) return $('#login-msg').textContent = 'ID должен быть от 3 символов (английские буквы/цифры)';

  $('#login-msg').textContent = 'Проверка...';
  const userRef = doc(db, 'users', name);
  const snap = await getDoc(userRef);

  if (!snap.exists()) {
    // Создаем нового
    myPeerId = 'peer-' + Math.random().toString(36).slice(2, 10);
    await setDoc(userRef, { id: name, peerId: myPeerId, friends: [] });
    friends = [];
  } else {
    // Загружаем существующего
    myPeerId = snap.data().peerId || ('peer-' + Math.random().toString(36).slice(2, 10));
    friends = snap.data().friends || [];
    await updateDoc(userRef, { peerId: myPeerId });
  }

  myId = name;
  localStorage.setItem('wowch_uid', myId);
  $('#login').style.display = 'none';
  $('#conn').textContent = 'Мой ID: ' + myId;
  $('#conn').style.color = 'var(--ok)';

  initPeer();
  renderFriends();

  // Слушаем входящие звонки
  peer.on('call', call => {
    $('#call-title').textContent = 'Входящий звонок';
    $('#call-ui').classList.add('on');
    $('#btn-acc').classList.remove('hidden');
    $('#btn-acc').onclick = () => {
      navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        call.answer(stream);
        setupCallUI(call);
      });
    };
  });
};

// Если уже входили ранее
const savedId = localStorage.getItem('wowch_uid');
if (savedId) {
  $('#username').value = savedId;
  login();
}

// --- ДРУЗЬЯ ---
window.renderFriends = () => {
  const l = $('#chs'); l.innerHTML = '';
  friends.forEach(fid => {
    const d = document.createElement('div');
    d.className = 'ch' + (activeFriend === fid ? ' on' : '');
    d.innerHTML = `<div class="av">${fid[0].toUpperCase()}</div> ${fid}`;
    d.onclick = () => openChat(fid);
    l.append(d);
  });
};

window.addFriend = async () => {
  const fid = prompt("Введите ID друга:");
  if (!fid || fid === myId || friends.includes(fid)) return;

  const snap = await getDoc(doc(db, 'users', fid));
  if (!snap.exists()) return alert('Пользователь с таким ID не найден.');

  friends.push(fid);
  await updateDoc(doc(db, 'users', myId), { friends: arrayUnion(fid) });
  renderFriends();
};
$('#btn-add').onclick = window.addFriend;

// --- ЧАТ ---
function openChat(fid) {
  activeFriend = fid;
  renderFriends();
  $('#chat-name').textContent = 'Чат с ' + fid;
  $('#btn-call').style.display = 'block';
  if (unsubMsgs) unsubMsgs();

  const chatId = [myId, fid].sort().join('_');
  const q = query(collection(db, 'chats', chatId, 'messages'), orderBy('t', 'asc'));

  unsubMsgs = onSnapshot(q, snap => {
    const msgs = $('#msgs'); msgs.innerHTML = '';
    snap.forEach(doc => {
      const m = doc.data();
      const div = document.createElement('div');
      div.className = 'msg ' + (m.uid === myId ? 'me' : 'them');
      div.innerHTML = `<div class="nm">${m.uid}</div>${m.text}`;
      msgs.append(div);
    });
    msgs.scrollTop = msgs.scrollHeight;
  });
}

window.sendMsg = async () => {
  const txt = $('#in').value.trim();
  if (!txt || !activeFriend) return;
  $('#in').value = '';
  const chatId = [myId, activeFriend].sort().join('_');
  await addDoc(collection(db, 'chats', chatId, 'messages'), {
    uid: myId, text: txt, t: Date.now()
  });
};
$('#btn-send').onclick = window.sendMsg;
$('#in').onkeydown = e => { if (e.key === 'Enter') window.sendMsg(); };

// --- ЗВОНКИ (PeerJS) ---
function initPeer() {
  peer = new Peer(myPeerId, { config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] } });
  peer.on('error', err => alert('Ошибка звонка: ' + err.type));
}

async function getFriendPeerId(fid) {
  const snap = await getDoc(doc(db, 'users', fid));
  return snap.exists() ? snap.data().peerId : null;
}

window.startCall = async () => {
  if (!activeFriend) return;
  const fidPeerId = await getFriendPeerId(activeFriend);
  if (!fidPeerId) return alert('Друг не в сети.');

  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    $('#call-title').textContent = 'Звоним...';
    $('#call-ui').classList.add('on');
    const call = peer.call(fidPeerId, stream);
    setupCallUI(call);
  }).catch(() => alert('Нет доступа к микрофону'));
};

function setupCallUI(call) {
  call.on('stream', remote => {
    $('#call-title').textContent = 'Разговор';
    $('#call-status').textContent = 'Соединено';
    const audio = new Audio(); audio.srcObject = remote; audio.play();
  });
  call.on('close', () => { $('#call-ui').classList.remove('on'); });
}
$('#btn-call').onclick = window.startCall;
$('#btn-dec').onclick = () => { if (peer) peer.destroy(), initPeer(); $('#call-ui').classList.remove('on'); };
</script>
</body>
</html>
